# dsh-web-search-zerokey — bundle patch 层
#
# 本文件把本插件插入 Cordis 组合，并把 seam 的 searchProvider 指到它。
#
# ── 为什么这里可以直接写 `- id: web` ──────────────────────────────────
# 层序（见 profile 的 cordis.yml 官方注释）：
#     bundle patch  →  用户的 cordis.patch.yml  →  --patch overlay
# 本文件属**最前**层，用户配置在后、会覆盖它。
# ⇒ 带上这个 pin 既让「装完即用」成立，又不剥夺用户改主意的权利。
#
# ── 这个 pin 不只是「选个 provider」──────────────────────────────────
# 官方搜索（deepseek-official）**每次搜索 = 一次完整模型 turn**，
# 直接扣积分。而它默认在 base bundle 里且 available() 恒报可用。
# 不显式指定的风险：seam 在「多个可用」时报 WEB_PROVIDER_AMBIGUOUS，
# 或 fallback 到那个烧积分的后端。
#
# 想换回官方搜索：在你自己的 cordis.patch.yml 里覆写 `web` 行即可。
- insert:
    - id: web-search-zerokey
      name: 'dsh-web-search-zerokey'

# ⚠️ patch 是**整块替换** config，不是合并（官方文档原文：
#    "a later patch can replace that row's complete config"）。
# 故这里必须**完整重述** base 里的另一项 fetchProvider —— 漏了它抓取就坏。
- id: web
  config:
    searchProvider: zerokey
    fetchProvider: http
