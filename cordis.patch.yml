# dsh-web-search-zerokey — bundle patch 层
#
# 本文件把本插件插入 Cordis 组合。
#
# ⚠️ 与 searxng 的写法不同：这里**不**声明 `- id: web` 覆盖。
#
# 原因：seam 的选择规则是「恰好一个 provider 可用时自动选中；
# 多个可用时必须显式指定，否则 WEB_PROVIDER_AMBIGUOUS」。
# 本 provider 的 available() 恒为 true，所以一旦它与其它可用 provider 并存，
# 就必须有人在 `web` 行显式指定 searchProvider。
#
# 这个决定不该由本插件替使用者做（它不知道自己会和谁共存），
# 所以选择权留给上层 patch —— 见 handoff/README-CA修复说明.md。
- insert:
    - id: web-search-zerokey
      name: 'dsh-web-search-zerokey'
